name: Build and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flip7-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps webkit chrome
      - run: npm run test:e2e

  deploy:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://flip7.krystonschwarze.com
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build
      - id: deploy
        run: npm run deploy
      - name: Check the live site
        run: |
          for attempt in $(seq 1 30); do
            curl -fsS https://flip7.krystonschwarze.com/sw.js | cmp -s - out/sw.js && break
            [ "$attempt" = 30 ] && { echo "The edge still serves another sw.js" >&2; exit 1; }
            sleep 2
          done
          for path in / /manifest.webmanifest; do
            curl -fsS -o /dev/null "https://flip7.krystonschwarze.com$path"
          done
      - if: failure() && steps.deploy.outcome == 'success'
        run: npx wrangler rollback --yes --message "Live check failed for ${{ github.sha }}"
